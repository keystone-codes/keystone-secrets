name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secrets
          POSTGRES_PASSWORD: secrets
          POSTGRES_DB: secrets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secrets -d secrets_test"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        env:
          SECRETS_TEST_DATABASE_URL: postgresql://secrets:secrets@localhost:5432/secrets_test
        run: uv run pytest -q

      - name: Build wheel
        run: uv build