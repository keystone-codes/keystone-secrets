[project]
name = "keystone-secrets"
version = "0.1.0"
description = "Shared secret storage for the Keystone contour"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
conformance = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
keystone-secrets = "keystone_secrets.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyyaml",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone_secrets"]

[tool.hatch.build.targets.wheel.sources]
"src/keystone_secrets" = "keystone_secrets"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["keystone_secrets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]